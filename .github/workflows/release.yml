name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run pii-check

      - run: npm test

  build:
    name: Build installers
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Sync version to installers
        run: npm run version:sync

      - name: Build banner assets
        run: npm run build:assets

      - name: Build all installers
        run: npm run build:all-installers

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 dist/checksums-sha256.txt
          }
          Get-Content dist/checksums-sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/*.exe dist/checksums-sha256.txt --title "${{ github.ref_name }}" --generate-notes
